<!DOCTYPE html><html class="dark" lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Nuevo Gasto - Modal</title>
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans / Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              amber: '#F59E0B',
              amberHover: '#D97706',
              emerald: '#10B981',
              emeraldLight: '#34D399',
              darkBg: '#090D14',
              surface: '#111722',
              surfaceCard: '#151D2A',
              surfaceBorder: '#232D3F',
              subtleText: '#94A3B8'
            }
          },
          boxShadow: {
            'glow-amber': '0 0 25px -5px rgba(245, 158, 11, 0.35)',
            'glow-emerald': '0 0 20px -4px rgba(16, 185, 129, 0.25)',
            'modal': '0 25px 60px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08)'
          }
        }
      }
    }
  </script>
<style data-purpose="custom-inputs">
    /* Custom sleek appearance */
    input::placeholder, textarea::placeholder {
      color: #64748B !important;
      font-size: 0.875rem;
    }
    select {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 0.85rem center;
      background-repeat: no-repeat;
      background-size: 1.15em 1.15em;
      padding-right: 2.5rem;
      appearance: none;
    }
  </style>
</head>
<body class="bg-[#070A0F] font-sans antialiased text-slate-200 min-h-screen flex items-center justify-center p-3 sm:p-6 relative overflow-x-hidden selection:bg-amber-500/20 selection:text-amber-300">
<!-- Atmospheric Radial Glows -->
<div class="fixed inset-0 pointer-events-none flex items-center justify-center z-0">
<div class="w-[700px] h-[550px] bg-gradient-to-tr from-amber-500/10 via-emerald-500/5 to-cyan-500/10 blur-[130px] rounded-full transform -translate-y-12 opacity-70"></div>
<div class="absolute inset-0 bg-[#070A0F]/80 backdrop-blur-[1px]"></div>
</div>
<!-- BEGIN: ModalOverlayBackdrop -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-md z-40 transition-opacity"></div>
<!-- END: ModalOverlayBackdrop -->
<!-- BEGIN: ModalWindow -->
<div class="relative z-50 w-full max-w-[1020px] bg-[#101622]/95 backdrop-blur-xl border border-white/10 rounded-2xl sm:rounded-3xl shadow-modal flex flex-col overflow-hidden ring-1 ring-white/5 transition-all">
<!-- BEGIN: ModalHeader -->
<header class="px-6 sm:px-8 py-5 border-b border-white/[0.08] flex flex-wrap items-center justify-between gap-4 bg-gradient-to-r from-white/[0.03] to-transparent">
<div class="flex items-center gap-5 sm:gap-6">
<!-- Modal Title with subtle Fintech Icon -->
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-xl bg-gradient-to-br from-amber-400/20 to-amber-600/10 border border-amber-500/30 flex items-center justify-center text-amber-400 shadow-sm shadow-amber-500/10">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<h2 class="text-xl sm:text-[22px] font-bold text-white tracking-tight">Nuevo Gasto</h2>
</div>
<!-- Status Pill Switch (Pagada / Deuda) -->
<div class="inline-flex items-center p-1 bg-[#090D15] rounded-xl border border-white/10 shadow-inner" role="group">
<button class="px-4 sm:px-5 py-1.5 text-xs font-bold rounded-lg bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 shadow-glow-amber transition-all duration-200 active:scale-95" type="button">
          Pagada
        </button>

</div>
</div>
<!-- Store & Date Meta Info Badges -->
<div class="flex items-center gap-2.5 sm:gap-3 text-xs font-medium">
<!-- Store badge -->

<!-- Date badge -->
<div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-amber-500/[0.08] border border-amber-500/20 text-amber-300">
<svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5m-9-6h.008v.008H12v-.008zM12 15h.008v.008H12V15zm0 2.25h.008v.008H12v-.008zM9.75 15h.008v.008H9.75V15zm0 2.25h.008v.008H9.75v-.008zM7.5 15h.008v.008H7.5V15zm0 2.25h.008v.008H7.5v-.008zm6.75-4.5h.008v.008h-.008v-.008zm0 2.25h.008v.008h-.008V15zm0 2.25h.008v.008h-.008v-.008zm2.25-4.5h.008v.008H16.5v-.008zm0 2.25h.008v.008H16.5V15z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="">mar, 06 oct. 2026</span>
</div>
</div>
</header>
<!-- END: ModalHeader -->
<!-- BEGIN: ModalContentBody -->
<main class="p-6 sm:p-8 grid grid-cols-1 lg:grid-cols-12 gap-7">
<!-- BEGIN: LeftFormColumn -->
<section class="lg:col-span-6 flex flex-col gap-4">
<!-- Nombre del Gasto -->
<div>
<label class="block text-[11px] font-bold tracking-wider text-slate-400 uppercase mb-2">NOMBRE DEL GASTO</label>
<div class="relative group">
<input class="w-full px-3.5 py-2.5 bg-[#0C1119] border border-white/10 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500/70 focus:ring-2 focus:ring-amber-500/20 hover:border-white/20 transition-all" placeholder="Ej. Compra de suministros oficina" type="text">
</div>
</div>
<!-- Proveedor & Categoría (2 columns) -->

<!-- Trabajador / Responsable -->
<div>
<label class="block text-[11px] font-bold tracking-wider text-slate-400 uppercase mb-2">TRABAJADOR / RESPONSABLE</label>
<select class="w-full px-3.5 py-2.5 bg-[#0C1119] border border-white/10 rounded-xl text-sm text-slate-400 focus:outline-none focus:border-amber-500/70 focus:ring-2 focus:ring-amber-500/20 hover:border-white/20 transition-all cursor-pointer">
<option selected="" value="">Selecciona trabajador (opcional)</option>
<option value="1">Carlos Morales</option>
<option value="2">Ana Mendoza</option>
</select>
</div>
<!-- Nota del Gasto -->
<div>
<label class="block text-[11px] font-bold tracking-wider text-slate-400 uppercase mb-2">NOTA DEL GASTO</label>
<textarea class="w-full px-3.5 py-2.5 bg-[#0C1119] border border-white/10 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500/70 focus:ring-2 focus:ring-amber-500/20 hover:border-white/20 transition-all resize-none" placeholder="Detalles adicionales sobre esta transaccion..." rows="5"></textarea>
</div>
</section>
<!-- END: LeftFormColumn -->
<!-- BEGIN: RightFinanceColumn -->
<section class="lg:col-span-6 flex flex-col gap-6">
<!-- Top Big Card: VALOR Hero Display -->
<div class="relative overflow-hidden bg-gradient-to-br from-[#161F2E] via-[#121926] to-[#0E131E] border border-white/10 rounded-2xl p-6 flex flex-col justify-between h-[132px] shadow-lg shadow-black/20 group">
<!-- subtle sheen decoration -->
<div class="absolute -right-8 -top-8 w-28 h-28 bg-amber-400/5 rounded-full blur-2xl group-hover:bg-amber-400/10 transition-colors"></div>
<span class="text-[11px] font-bold tracking-widest text-slate-400 uppercase">VALOR</span>
<div class="flex items-baseline gap-2.5">
<span class="text-3xl font-extrabold text-amber-400 leading-none drop-shadow-sm">$</span>
<span class="text-5xl font-extrabold text-white tracking-tight leading-none drop-shadow">0.00</span>
</div>
</div>
<!-- Payment Method Box -->
<div class="flex flex-col gap-3">
<!-- Section title with Counter control -->
<div class="flex items-center justify-between">
<span class="text-[11px] font-bold tracking-wider text-slate-400 uppercase">METODO DE PAGO</span>
<!-- Plus/Minus Counter -->
<div class="inline-flex items-center bg-[#0C1119] border border-white/10 rounded-lg text-xs overflow-hidden shadow-sm">
<button class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/[0.06] transition active:scale-95" type="button">
              −
            </button>
<span class="w-6 text-center font-bold text-white text-xs">1</span>
<button class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/[0.06] transition active:scale-95" type="button">
              +
            </button>
</div>
</div>
<!-- Pago 1 Container -->
<div class="flex flex-col gap-1.5">
<span class="text-[11px] font-semibold text-slate-400">Pago 1</span>
<div class="flex items-center gap-2.5">
<!-- Currency input with S/ -->
<div class="relative flex-1">
<span class="absolute inset-y-0 left-0 pl-4 flex items-center text-sm font-bold text-slate-300 pointer-events-none">
                S/
              </span>
<input class="w-full pl-10 pr-3 py-4 bg-[#0C1119] border border-white/10 rounded-xl text-base font-semibold text-white focus:outline-none focus:border-amber-500/70 focus:ring-2 focus:ring-amber-500/20 hover:border-white/20 transition-all h-[64px]" type="text">
</div>
<!-- Payment Method Selectors -->
<div class="flex items-center gap-2">
<!-- Efectivo (Active highlighted state) -->
<button class="h-[64px] w-[64px] rounded-xl bg-emerald-500/[0.08] border-2 border-emerald-500 flex flex-col items-center justify-center gap-1 shadow-glow-emerald transition-all transform active:scale-95 relative" type="button">
<!-- Cash banknote icon -->
<div class="w-7 h-4 bg-emerald-600 rounded-sm flex items-center justify-center border border-emerald-400 shadow-inner">
<span class="text-[8px] font-black text-white">$</span>
</div>
<span class="text-[10px] font-bold text-emerald-300 tracking-tight">Efectivo</span>
</button>
<!-- Yape -->
<button class="h-[64px] w-[64px] rounded-xl bg-[#0C1119] border border-white/10 flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 hover:border-purple-400/50 hover:bg-purple-950/20 transition-all transform active:scale-95 group" type="button">
<!-- Yape stylized badge -->
<div class="w-5 h-5 rounded-md bg-[#6B21A8] group-hover:bg-[#7E22CE] flex items-center justify-center text-white text-[9px] font-black italic tracking-tighter shadow-sm transition-colors">
                  yape
                </div>
<span class="text-[10px] font-medium text-slate-300">Yape</span>
</button>
<!-- Otra / Card -->
<button class="h-[64px] w-[64px] rounded-xl bg-[#0C1119] border border-white/10 flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 hover:border-white/25 hover:bg-white/[0.04] transition-all transform active:scale-95" type="button">
<!-- Credit card icon -->
<svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<rect height="14" rx="2" stroke-linecap="round" stroke-linejoin="round" width="20" x="2" y="5"></rect>
<line stroke-linecap="round" x1="2" x2="22" y1="10" y2="10"></line>
</svg>
<span class="text-[10px] font-medium text-slate-300">Otra</span>
</button>
</div>
</div>
</div>
<!-- Distribution Summary bar -->
<div class="mt-2 pt-3 flex items-center justify-between text-xs border-t border-white/[0.08]">
<span class="text-sky-400 font-medium">Distribución completa</span>
<span class="text-white font-bold tracking-wide">S/ 0.00</span>
</div>
</div>
</section>
<!-- END: RightFinanceColumn -->
</main>
<!-- END: ModalContentBody -->
<!-- BEGIN: ModalFooter -->
<footer class="px-6 sm:px-8 py-4 border-t border-white/[0.08] bg-[#0A0E16]/80 backdrop-blur-md flex flex-wrap items-center gap-4 justify-end">
<!-- Left side: Descartar button -->

<!-- Right side: Attachment, Traceability & Main Confirm button -->
<div class="flex items-center gap-3">
<!-- Adjuntar Recibo button -->

<!-- Probar Trazabilidad button -->

<!-- Crear Gasto Primary Action Button -->
<button class="text-xs font-semibold text-slate-400 hover:text-white transition px-4 py-2.5 rounded-xl hover:bg-white/[0.04]" type="button">Descartar</button><button class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 text-xs font-bold shadow-glow-amber transition-all transform active:scale-95" type="button">
        Crear Gasto
      </button>
</div>
</footer>
<!-- END: ModalFooter -->
</div>
<!-- END: ModalWindow -->


</body></html>
