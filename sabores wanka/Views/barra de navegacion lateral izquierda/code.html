<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Sabores Wanka - Barra de Navegación Lateral</title>
  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style data-purpose="custom-scrollbars">
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a4a56; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b6b7a; }
  </style>
</head>
<body class="h-full w-full bg-[#0b0e14] text-slate-100 overflow-hidden select-none font-sans antialiased">

  <!-- Zona de activación: borde izquierdo absoluto de la ventana -->
  <div id="trigger" class="fixed left-0 top-0 h-full w-4 z-40"></div>

  <!-- Panel lateral (280px) -->
  <aside id="sidebar"
         class="fixed left-0 top-0 h-full w-[280px] z-50 flex flex-col p-4
                bg-[#1c3c48]/95 backdrop-blur-xl
                border-r border-white/10 shadow-2xl
                transition-transform duration-[400ms] ease-out will-change-transform">

    <!-- Encabezado -->
    <div class="flex items-center gap-3 px-1 mb-5 mt-1">
      <div class="grid place-items-center w-9 h-9 rounded-lg bg-[#3B82F6]">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" class="w-[18px] h-[18px]">
          <path d="M12 3a9 9 0 1 0 9 9"></path>
          <path d="M12 8a4 4 0 1 0 4 4"></path>
        </svg>
      </div>
      <div class="min-w-0">
        <div class="text-[18px] font-semibold text-white leading-tight truncate">Sabores Wanka</div>
        <div class="text-[11px] font-semibold text-[#38BDF8] leading-tight">Principal</div>
      </div>
    </div>

    <!-- Botones de estado -->
    <div class="flex flex-col gap-2 mb-4">
      <!-- WhatsApp -->
      <button class="flex items-center gap-3 w-full h-[52px] px-3 rounded-xl
                     bg-[#25D3660f] border border-[#25D36622] hover:bg-[#25D3661a] transition-colors">
        <span class="grid place-items-center w-8 h-8 rounded-lg bg-[#25D366] shrink-0">
          <svg viewBox="0 0 24 24" fill="white" class="w-[16px] h-[16px]">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413"></path>
          </svg>
        </span>
        <span class="flex flex-col items-start leading-tight">
          <span class="text-[10px] font-bold tracking-wide text-[#4ADE80]">WHATSAPP</span>
          <span class="text-[9px] text-[#94A3B8]">Online</span>
        </span>
      </button>

      <!-- Punto de Venta -->
      <button class="flex items-center gap-3 w-full h-[52px] px-3 rounded-xl
                     bg-[#0EA5E90f] border border-[#0EA5E922] hover:bg-[#0EA5E91a] transition-colors">
        <span class="grid place-items-center w-8 h-8 rounded-lg bg-[#0EA5E9] shrink-0">
          <i data-lucide="arrow-down-to-line" class="w-4 h-4 text-white"></i>
        </span>
        <span class="flex flex-col items-start leading-tight">
          <span class="text-[10px] font-bold tracking-wide text-[#38BDF8]">PUNTO DE VENTA</span>
          <span class="text-[9px] text-[#94A3B8]">Procesar venta</span>
        </span>
      </button>
    </div>

    <!-- Navegación -->
    <nav class="flex-1 overflow-y-auto -mr-2 pr-2">
      <div class="flex flex-col gap-0.5">
        <button class="group flex items-center gap-3 w-full h-10 px-3 rounded-lg text-[#D4D4D8]
                       hover:bg-white/10 hover:text-white transition-colors">
          <i data-lucide="history" class="w-4 h-4 text-[#A1A1AA] group-hover:text-white"></i>
          <span class="text-[14px]">Historial</span>
        </button>
        <button class="group flex items-center gap-3 w-full h-10 px-3 rounded-lg text-[#D4D4D8]
                       hover:bg-white/10 hover:text-white transition-colors">
          <i data-lucide="shopping-cart" class="w-4 h-4 text-[#A1A1AA] group-hover:text-white"></i>
          <span class="text-[14px]">Productos</span>
        </button>
        <button class="group flex items-center gap-3 w-full h-10 px-3 rounded-lg text-[#D4D4D8]
                       hover:bg-white/10 hover:text-white transition-colors">
          <i data-lucide="credit-card" class="w-4 h-4 text-[#A1A1AA] group-hover:text-white"></i>
          <span class="text-[14px]">Créditos</span>
        </button>
        <button class="group flex items-center gap-3 w-full h-10 px-3 rounded-lg text-[#D4D4D8]
                       hover:bg-white/10 hover:text-white transition-colors">
          <i data-lucide="users" class="w-4 h-4 text-[#A1A1AA] group-hover:text-white"></i>
          <span class="text-[14px]">Clientes</span>
        </button>
        <button class="group flex items-center gap-3 w-full h-10 px-3 rounded-lg text-[#D4D4D8]
                       hover:bg-white/10 hover:text-white transition-colors">
          <i data-lucide="user" class="w-4 h-4 text-[#A1A1AA] group-hover:text-white"></i>
          <span class="text-[14px]">Trabajadores</span>
        </button>
      </div>
    </nav>

    <!-- Perfil -->
    <div class="border-t border-white/10 pt-4 mt-4 flex items-center gap-3">
      <div class="grid place-items-center w-9 h-9 rounded-full bg-[#3B82F6] text-white shrink-0">
        <i data-lucide="user" class="w-4 h-4"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-[13px] font-semibold text-white truncate">Iniciar sesión</div>
        <div class="text-[9px] font-bold text-[#38BDF8] tracking-wide">Cuenta de usuario</div>
      </div>
      <button class="p-1 rounded-md hover:bg-white/10 transition-colors">
        <i data-lucide="settings" class="w-4 h-4 text-[#71717A]"></i>
      </button>
    </div>
  </aside>

  <script>
    lucide.createIcons();

    const sidebar = document.getElementById('sidebar');
    const trigger = document.getElementById('trigger');

    const openSidebar = () => {
      sidebar.classList.remove('-translate-x-full', 'pointer-events-none');
      sidebar.classList.add('pointer-events-auto');
    };
    const closeSidebar = () => {
      sidebar.classList.add('-translate-x-full', 'pointer-events-none');
      sidebar.classList.remove('pointer-events-auto');
    };

    trigger.addEventListener('mouseenter', openSidebar);
    sidebar.addEventListener('mouseenter', openSidebar);
    sidebar.addEventListener('mouseleave', closeSidebar);
  </script>
</body>
</html>
